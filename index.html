<script>/* Thème : "sys" (suit l'iPhone), "light", "dark" — appliqué avant le premier affichage */
(function(){var K="ek.theme",mq=matchMedia("(prefers-color-scheme: light)");
function pref(){try{var v=localStorage.getItem(K);return v==="light"||v==="dark"?v:"sys"}catch(e){return "sys"}}
function apply(){var p=pref(),t=p==="sys"?(mq.matches?"light":"dark"):p,r=document.documentElement;r.dataset.theme=t;r.dataset.pref=p;
 var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==="light"?"#F4F4F6":"#0A0A0B";
 var sb=document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');if(sb)sb.content=t==="light"?"default":"black-translucent";
 var b=document.getElementById("thm");if(b){b.textContent=thmIcon();b.setAttribute("aria-label","Thème : "+({sys:"selon le système",light:"clair",dark:"sombre"})[p])}}
window.thmIcon=function(){return ({sys:"◐",light:"☀︎",dark:"☾"})[pref()]};
window.thmCycle=function(){var n=({sys:"light",light:"dark",dark:"sys"})[pref()];try{localStorage.setItem(K,n)}catch(e){}apply()};
window.thmApply=apply;
if(mq.addEventListener)mq.addEventListener("change",apply);else if(mq.addListener)mq.addListener(apply);
apply()})();</script>
